# Prometheus scrape configuration for local-api
#
# This config tells Prometheus where to collect metrics from.
# The API exposes Prometheus-format metrics at GET /metrics.
#
# IMPORTANT: The API must be running (npm start) for Prometheus to
# collect data. If Prometheus shows "target down", check:
#   1. Is npm start running?
#   2. Is the port correct? (default: 3001)
#   3. On Linux, change host.docker.internal to 172.17.0.1

global:
  scrape_interval: 5s      # scrape every 5 seconds
  evaluation_interval: 5s  # evaluate rules every 5 seconds

scrape_configs:
  - job_name: 'local-api'
    static_configs:
      - targets:
          # host.docker.internal = your machine (from inside Docker)
          # Works on: Docker Desktop for Windows/Mac
          # Linux: replace with 172.17.0.1 or your host IP
          - 'host.docker.internal:3001'
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Also scrape Prometheus itself (for monitoring-the-monitor)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
