# ╔══════════════════════════════════════════════════════════════════╗
# ║  k6 Monitoring Stack                                            ║
# ╠══════════════════════════════════════════════════════════════════╣
# ║                                                                  ║
# ║  WHAT THIS STARTS                                               ║
# ║  • InfluxDB  (port 8086) — stores k6 metrics                   ║
# ║  • Prometheus (port 9090) — scrapes the API's /metrics endpoint ║
# ║  • Grafana   (port 3000)  — dashboards for both                 ║
# ║                                                                  ║
# ║  QUICK START                                                     ║
# ║  1. Start stack:                                                 ║
# ║     docker compose -f k6/monitoring/docker-compose.yml up -d   ║
# ║                                                                  ║
# ║  2. Run k6 with InfluxDB output:                                ║
# ║     k6 run --out influxdb=http://localhost:8086/k6 \            ║
# ║            k6/tests/02-load.js                                  ║
# ║                                                                  ║
# ║  3. Open Grafana: http://localhost:3000 (admin/admin)           ║
# ║     Import dashboard ID 2587 from grafana.com                   ║
# ║                                                                  ║
# ║  4. Stop stack:                                                  ║
# ║     docker compose -f k6/monitoring/docker-compose.yml down    ║
# ║                                                                  ║
# ╚══════════════════════════════════════════════════════════════════╝

services:
  # ── InfluxDB v1.8 ────────────────────────────────────────────────────────────
  # Stores k6 metrics. k6 writes here via --out influxdb=http://localhost:8086/k6
  # Uses v1.8 because it has the best native k6 support.
  influxdb:
    image: influxdb:1.8
    container_name: k6_influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6                       # database name (matches k6 --out URL)
      - INFLUXDB_HTTP_AUTH_ENABLED=false     # no auth for local use
      - INFLUXDB_REPORTING_DISABLED=true
    volumes:
      - influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ───────────────────────────────────────────────────────────────
  # Scrapes the API's built-in /metrics endpoint (Prometheus format).
  # Lets you correlate k6 test load with server-side metrics like heap usage.
  prometheus:
    image: prom/prometheus:latest
    container_name: k6_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    extra_hosts:
      # Allows containers to reach the host machine where the API runs
      - "host.docker.internal:host-gateway"

  # ── Grafana ──────────────────────────────────────────────────────────────────
  # Visualization. Auto-configured with InfluxDB and Prometheus datasources.
  grafana:
    image: grafana/grafana:latest
    container_name: k6_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true       # skip login for local use
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin     # full access without login
      - GF_AUTH_DISABLE_LOGIN_FORM=false     # still allow login if needed
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      influxdb:
        condition: service_healthy
      prometheus:
        condition: service_started

volumes:
  influxdb_data:
  prometheus_data:
  grafana_data:
